name: access-keycloak

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - identity_data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      ACCESS_WEB_OIDC_CLIENT_SECRET: ${ACCESS_WEB_OIDC_CLIENT_SECRET:?Set ACCESS_WEB_OIDC_CLIENT_SECRET in .env}
      ACCESS_LAB_USER_PASSWORD: ${ACCESS_LAB_USER_PASSWORD:?Set ACCESS_LAB_USER_PASSWORD in .env}
    volumes:
      - ./realm-access.json:/opt/keycloak/data/import/realm-access.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - identity_data
      - identity_app

volumes:
  keycloak_db_data:

networks:
  identity_app:
    name: access-keycloak_identity_app
  identity_data:
    internal: true
